# Run this on the relay host (a VPS with good connectivity to your uploader).
services:
  relayport:
    image: relayport:latest   # docker build -t relayport .
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # put a TLS reverse proxy (Caddy, nginx) in front
    environment:
      RELAYPORT_UPLOAD_PASSWORD: change-me-upload-password
      RELAYPORT_PULL_TOKEN: change-me-long-random-token
      RELAYPORT_QUOTA: 50GiB            # refuse uploads beyond this much staged data
      RELAYPORT_STALE_TTL: 48h          # drop half-finished uploads untouched this long
      RELAYPORT_TRUST_PROXY: "1"        # read the client IP from X-Forwarded-For (only behind a proxy)
    volumes:
      - ./data:/data
