# Run this on the destination (e.g. a NAS). It only makes outbound connections.
services:
  inbox-puller:
    image: inbox-relay:latest
    command: ["pull"]
    restart: unless-stopped
    environment:
      IR_SERVER: https://relay.example.com
      IR_PULL_TOKEN: change-me-long-random-token
      IR_PARALLEL: "4"           # concurrent segment downloads
      IR_FILES: "2"              # files in flight at once
      IR_SEGMENT: 16MiB
    volumes:
      - /path/to/inbox:/inbox
